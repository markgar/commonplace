[package]
name = "rust-packaging"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytemuck = "1.24"
fastembed = { version = "=7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
grafeo = { version = "=0.5.43", default-features = false, features = ["lpg"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde_json = "1.0"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
sqlite-vec = "=0.1.6"

[dev-dependencies]
tempfile = "3.23"
