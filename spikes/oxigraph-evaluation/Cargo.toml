[package]
name = "oxigraph-evaluation"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = []
rdf12-probe = ["oxigraph/rdf-12"]

[dependencies]
anyhow = "1.0"
bytemuck = "1.24"
fastembed = { version = "=7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
oxigraph = { version = "=0.5.11", default-features = false, features = ["rocksdb"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde_json = "1.0"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
sqlite-vec = "=0.1.6"
tempfile = "3.23"
