[package]
name = "commonplace"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
description = "A local, evidence-backed knowledge system"
publish = false

[[bin]]
name = "commonplace"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fastembed = { version = "=7.1.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
globset = "0.4"
hf-hub = { version = "=0.5.0", default-features = false, features = ["ureq"] }
grafeo = { version = "=0.5.43", default-features = false, features = ["lpg"] }
jsonschema = { version = "0.33", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
sqlite-vec = "=0.1.6"
tempfile = "3.23"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2.5"

[profile.release]
lto = "thin"
strip = true
